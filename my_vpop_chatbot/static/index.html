<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>V-Pop Drama Bot</title>
  <style>
    body {font-family:'Segoe UI',sans-serif;background:#0f0f0f;color:#fff;margin:0;height:100vh;display:flex;flex-direction:column;}
    #chat {flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px;}
    .msg {max-width:80%;padding:14px 20px;border-radius:20px;line-height:1.6;word-wrap:break-word;}
    .user {align-self:flex-end;background:#1e88e5;color:white;}
    .bot {align-self:flex-start;background:#262626;color:#fff;}
    #input-area {padding:15px;background:#111;display:flex;}
    input {flex:1;padding:16px;border:none;border-radius:30px;background:#222;background:#222;color:white;font-size:16px;outline:none;}
    button {margin-left:10px;background:#1db954;border:none;width:52px;height:52px;border-radius:50%;color:white;font-size:22px;cursor:pointer;}
    h1 {text-align:center;background:linear-gradient(90deg,#ff6b6b,#4ecdc4,#45b7d1); -webkit-background-clip:text;color:transparent;margin:20px 0 0;}
  </style>
</head>
<body>
  <h1>V-Pop Drama Bot</h1>
  <div id="chat">
    <div class="msg bot">Yo boss! Hỏi tui bất kỳ drama nào trong Vbiz đi</div>
  </div>
  <div id="input-area">
    <input type="text" id="msg" placeholder="Sơn Tùng với ai..." autocomplete="off" />
    <button onclick="send()">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('msg');

    async function send() {
      let question = input.value.trim();
      if (!question) return;
      addMsg(question, 'user');
      input.value = '';

      const res = await fetch('/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: question})
      });
      const data = await res.json();
      addMsg(data.reply, 'bot');
    }

    function addMsg(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerHTML = text.replace(/\n/g, '<br>');
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    input.addEventListener('keypress', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
